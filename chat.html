<body>
    <div class="chat-container">
        <div class="chat-header">
            <button class="back-btn" onclick="window.location.href='index.html'">◄ ZPĚT</button>
            CHIMP FINDER
        </div>
        
        <div class="scam-warning">⚠️ VAROVÁNÍ: UŽIVATEL VYMÁHÁ BANÁNY A PENÍZE ⚠️</div>

        <div class="profile-match">
            <div class="chimp-avatar">🦍</div>
            <div class="chimp-info">
                <h2>Kong_69 <span class="status-dot">●</span></h2>
                <p>0.5 km daleko | Cíl: Tvá peněženka</p>
            </div>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="message msg-chimp">
                U OOH AHH AHH!! 🍌💦 Zaplať, nebo ti zlomím nohy. Vím o tvých dluzích.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Napiš zprávu..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        let messageCount = 0;

        const monkeyReplies = [
            "OOH OOH AHH AHH! Dělej prachy!",
            "Kde jsou moje banány? 🍌",
            "Pošli mi detaily kreditky. Jsem opravdová lidská samice.",
            "*Háze exkrementy na monitor*",
            "Tvoje dluhy rostou. Banka mi volala.",
            "Už stojím před tvým domem."
        ];

        function addMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'msg-user' : 'msg-chimp'}`;
            msg.textContent = text;
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addExtortion() {
            const msg = document.createElement('div');
            msg.className = 'message msg-chimp';
            msg.innerHTML = `Vím, že máš peníze z automatů. Dej mi 1000 Kč, nebo na tebe pošlu virus. <button class="action-btn" onclick="payMonkey(this)">ZAPLATIT 1000 Kč VÝPALNÉ</button>`;
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        window.payMonkey = function(btn) {
            let debt = parseInt(localStorage.getItem('chimp_debt')) || 0;
            localStorage.setItem('chimp_debt', debt + 1000);
            btn.textContent = "ZAPLACENO (Dluh navýšen o 1000 Kč)";
            btn.disabled = true;
            btn.style.background = "#555";
            btn.style.color = "#aaa";
            setTimeout(() => addMessage("Dobrá opička. Ale zítra chci víc.", false), 1500);
        };

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            chatInput.value = '';
            messageCount++;

            setTimeout(() => {
                // Po 3 zprávách začne opice vydírat uživatele
                if (messageCount === 3) {
                    addExtortion();
                } else {
                    addMessage(monkeyReplies[Math.floor(Math.random() * monkeyReplies.length)], false);
                }
            }, 800 + Math.random() * 1200);
        }

        chatInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
