<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chimpinder | Horké opice v okolí</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Speciální úprava pro seznamkový vibe */
        .chat-header {
            background: #ff007f !important;
            border-bottom: 3px solid yellow !important;
        }
        .scam-banner {
            background: yellow;
            color: black;
            font-size: 0.8rem;
            padding: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .message.monkey { background: #333; border-left: 4px solid #ff007f; }
    </style>
</head>
<body class="chat-body">
    <div class="scam-banner">⚠️ VAROVÁNÍ: Neposílejte banány opicím, které neznáte osobně! ⚠️</div>
    
    <header class="chat-header main-nav">
        <button class="nav-btn" onclick="window.location.href='index.html'">◄ ÚTĚK ZPĚT</button>
        <h2 style="color: white; font-family: 'Montserrat';">🔥 CHIMPINDER 🔥</h2>
    </header>

    <main id="chat-container">
        <div id="chat-box">
            </div>
        
        <div class="chat-input-area">
            <div id="quick-replies">
                </div>
        </div>
    </main>

    <script src="chat.js"></script>
</body>
</html>
