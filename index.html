<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davidovy Automaty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .repay-container {
            margin: 10px 0;
            text-align: center;
        }
        .btn-repay {
            background: #4ade80;
            color: #1a1a1a;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-repay:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn active" onclick="navigate('index.html')">🏠 Automaty</button>
        <button class="nav-btn" onclick="navigate('bank.html')">🦍 Banka</button>
        <button class="nav-btn" onclick="navigate('help.html')">🆘 Pomoc</button>
        <button class="nav-btn" onclick="window.location.href='cpp.html'">🐺 Svatyně (Čtvrtletka)</button>
    </nav>

    <div class="page-layout">
        <div class="panel-container">
            <div class="header">
                <h1>DAVIDOVY AUTOMATY</h1>
                <div class="subtitle">davidlazarek.github.io</div>
            </div>

            <div class="status-bar">
                <div class="status-box">
                    <div class="status-label">K DISPOZICI</div>
                    <div class="status-val val-good"><span class="wallet-display">100</span> 🍌</div>
                </div>
                <div class="status-box">
                    <div class="status-label">DLUH U ŠIMPANZE</div>
                    <div class="status-val val-bad"><span class="debt-display">0</span> 🍌</div>
                </div>
            </div>

            <div class="repay-container">
                <button id="repay-button" class="btn-repay" onclick="repayDebt()">SPLATIT CELÝ DLUH</button>
            </div>

            <div class="reels-window">
                <div class="reels">
                    <div class="reel" id="reel1">🍌</div>
                    <div class="reel" id="reel2">🍌</div>
                    <div class="reel" id="reel3">🍌</div>
                </div>
            </div>

            <button id="spin-button" class="btn-primary">ZATOČIT (Cena: 5🍌)</button>
            
            <div class="message-box">
                <p id="message">Vítej! Klikni na "Zatočit" pro hru.</p>
            </div>

            <div class="rules">
                <h3>VÝHRY</h3>
                <div class="payout-grid">
                    <div class="payout-item"><span>🍌 🍌 🍌</span> <span class="prize">+100</span></div>
                    <div class="payout-item"><span>🍒 🍒 🍒</span> <span class="prize">+25</span></div>
                    <div class="payout-item"><span>🍋 🍋 🍋</span> <span class="prize">+25</span></div>
                    <div class="payout-item"><span>🔔 🔔 🔔</span> <span class="prize">+25</span></div>
                    <div class="payout-item"><span>⭐ ⭐ ⭐</span> <span class="prize">+25</span></div>
                    <div class="payout-item"><span>Jakékoliv dva 🍌</span> <span class="prize">+10</span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="chimp-toast" class="chimp-toast">
        <div class="toast-header">📩 Zpráva od: Šimpanz</div>
        <div class="toast-body" id="toast-message">...</div>
    </div>

    <div id="hacked-ads-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let wallet = parseInt(urlParams.get('wallet')); wallet = isNaN(wallet) ? 100 : wallet;
        let debt = parseInt(urlParams.get('debt')); debt = isNaN(debt) ? 0 : debt;
        let spinsInDebt = parseInt(urlParams.get('spins')); spinsInDebt = isNaN(spinsInDebt) ? 0 : spinsInDebt;
        let loanCount = parseInt(urlParams.get('loans')); loanCount = isNaN(loanCount) ? 0 : loanCount;

        function navigate(page) {
            window.location.href = `${page}?wallet=${wallet}&debt=${debt}&spins=${spinsInDebt}&loans=${loanCount}`;
        }

        // --- HUDBA A ZVUKY ---
        const sfxSpin = new Audio('spin.mp3');
        const sfxWin = new Audio('win.mp3');
        const sfxJackpot = new Audio('jackpot.mp3');
        const sfxMonkey = new Audio('monkey.mp3');
        
        const bgMusic = new Audio('bg-music.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.15;
        let isMusicPlaying = false;

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        const SPIN_COST = 5;
        const SYMBOLS = ['🍌', '🍒', '🍋', '🔔', '⭐'];
        const walletDisplays = document.querySelectorAll('.wallet-display');
        const debtDisplays = document.querySelectorAll('.debt-display');
        const reelElements = [document.getElementById("reel1"), document.getElementById("reel2"), document.getElementById("reel3")];
        const spinButton = document.getElementById("spin-button");
        const repayButton = document.getElementById("repay-button");
        const messageDisplay = document.getElementById("message");
        const chimpToast = document.getElementById("chimp-toast");
        const toastMessage = document.getElementById("toast-message");
        let toastTimeout;

        const chimpThreats = {
            5: "Pěkně točíš, ale ten dluh tam pořád vidím. 🍌",
            15: "Nezapomeň, že šimpanz nikdy nezapomíná. 🦍",
            30: "Už mi dlužíš docela dlouho. Moje trpělivost má meze.",
            50: "Gorily už si obouvají boty..."
        };

        function showChimpToast(text) {
            playSound(sfxMonkey);
            toastMessage.textContent = `"${text}"`;
            chimpToast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { chimpToast.classList.remove('show'); }, 6000);
        }

        // --- VIRUS REKLAMY NA SEZNAMKU ---
        function createChimpAd() {
            const ad = document.createElement('div');
            ad.className = 'fake-ad';
            ad.style.top = Math.floor(Math.random() * 70) + 10 + "%";
            ad.style.left = Math.floor(Math.random() * 70) + 10 + "%";
            ad.style.transform = `rotate(${Math.floor(Math.random() * 40) - 20}deg)`;
            
            ad.innerHTML = `
                <button class="close-btn">X</button>
                🔥 ŽHAVÍ NEZADANÍ ŠIMPANZI<br>VE TVÉM OKOLÍ ČEKAJÍ<br>NA TVÉ BANÁNY! 🍌💦<br>
                <button class="chat-btn">KLIKNI ZDE PRO CHAT</button>
            `;

            const handleClose = (e) => {
                e.stopPropagation(); 
                ad.remove();
                // Když reklamu zavře, vyskočí dvě další (hydra efekt)
                createChimpAd(); 
                createChimpAd();
            };

            ad.querySelector('.close-btn').addEventListener('click', handleClose);
            ad.querySelector('.chat-btn').addEventListener('click', (e) => {
                handleClose(e); 
                navigate('chat.html');
            });
            document.getElementById('hacked-ads-container').appendChild(ad);
        }

        function updateAllDisplays() {
            walletDisplays.forEach(el => el.textContent = wallet);
            debtDisplays.forEach(el => {
                el.textContent = debt;
                el.parentElement.style.color = debt > 0 ? "#ff4b2b" : "#888";
            });
            repayButton.disabled = (debt <= 0 || wallet < debt);
        }

        function repayDebt() {
            if (wallet >= debt) {
                wallet -= debt;
                debt = 0;
                spinsInDebt = 0;
                messageDisplay.textContent = "Dluh splacen! Jsi čistý jako čerstvě oloupaný banán.";
                messageDisplay.className = "win";
                updateAllDisplays();
                
                // Vyčistí otravné reklamy po splacení dluhu
                document.getElementById('hacked-ads-container').innerHTML = '';
            }
        }

        function spin() {
            if (!isMusicPlaying) {
                bgMusic.play().catch(() => {});
                isMusicPlaying = true;
            }

            if (wallet < SPIN_COST) {
                messageDisplay.textContent = "Nemáš banány! Běž si půjčit do Banky.";
                messageDisplay.className = "lose"; return;
            }
            wallet -= SPIN_COST;
            playSound(sfxSpin);

            if (debt > 0) {
                spinsInDebt++;
                if (chimpThreats[spinsInDebt]) showChimpToast(chimpThreats[spinsInDebt]);
            }

            updateAllDisplays();
            spinButton.disabled = true;
            repayButton.disabled = true;
            messageDisplay.className = "";
            messageDisplay.textContent = "Točí se...";

            const results = [SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)], SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)], SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]];

            reelElements.forEach(reel => { reel.textContent = '✡️'; reel.classList.add('spinning'); reel.classList.remove('landed'); });

            reelElements.forEach((reel, index) => {
                setTimeout(() => {
                    reel.classList.remove('spinning'); reel.textContent = results[index]; reel.classList.add('landed');
                }, 1000 + (index * 500));
            });

            setTimeout(() => {
                checkWin(results[0], results[1], results[2]); 
                updateAllDisplays(); 
                spinButton.disabled = false;
            }, 2600);
        }

        function checkWin(r1, r2, r3) {
            let payout = 0; let winMessage = "Zkus to znovu!";
            messageDisplay.className = "lose";
            if (r1 === r2 && r2 === r3) {
                if (r1 === '🍌') { 
                    payout = 100; winMessage = "🍌 JACKPOT! +100 🍌"; playSound(sfxJackpot); 
                } else { 
                    payout = 25; winMessage = `Tři ${r1}! +25 🍌`; playSound(sfxWin); 
                }
            } else if ((r1 === '🍌' && r2 === '🍌') || (r1 === '🍌' && r3 === '🍌') || (r2 === '🍌' && r3 === '🍌')) {
                payout = 10; winMessage = "Dva banány! +10 🍌"; playSound(sfxWin);
            }
            wallet += payout; 
            messageDisplay.textContent = winMessage;
            if (payout > 0) messageDisplay.className = "win";
        }

        // Inicializace při spuštění hry
        updateAllDisplays();
        createChimpAd(); // Založí první reklamu
        spinButton.addEventListener("click", spin);
    </script>
</body>
</html>
