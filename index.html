<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Velocity | Cyber-Monkey Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-overlay" class="start-overlay">
        <div class="start-content">
            <h1 class="glitch-text" data-text="VAROVÁNÍ">VAROVÁNÍ</h1>
            <p>Tento web obsahuje hazard, opice a viry.<br>Zapni si zvuk a vstup na vlastní nebezpečí.</p>
            <button id="enter-btn" class="action-btn warning">VSTOUPIT DO KASINA</button>
        </div>
    </div>

    <nav class="main-nav">
        <button class="nav-btn active" data-target="casino">KASINO</button>
        <button class="nav-btn" data-target="bank">BANKA (DLUHY)</button>
        <button class="nav-btn" onclick="window.location.href='chat.html'">🔥 CHIMPINDER 🔥</button>
    </nav>

    <main id="app-container">
        <section id="casino" class="screen active">
            <h1 class="glitch-text" data-text="SLOT MACHINE">SLOT MACHINE</h1>
            <div class="slot-machine">
                <div class="reels-container">
                    <div class="reel" id="reel1">🦍</div>
                    <div class="reel" id="reel2">🦍</div>
                    <div class="reel" id="reel3">🦍</div>
                </div>
                <button id="spin-btn" class="action-btn">SPIN (10 🍌)</button>
            </div>
            <div class="stats">
                <div class="stat-box success">Zůstatek: <span id="balance">1000</span> 🍌</div>
            </div>
            <div id="message-log" class="terminal-log">Systém online. Čekám na sázky...</div>
        </section>

        <section id="bank" class="screen">
            <h1 class="glitch-text" data-text="UNDERGROUND BANKA">UNDERGROUND BANKA</h1>
            <p class="subtitle">Úrok 5% každou minutu.</p>
            
            <div class="stats bank-stats">
                <div class="stat-box success">Zůstatek<br><span id="bank-balance">1000</span> 🍌</div>
                <div class="stat-box danger">Dluh<br><span id="bank-debt">0</span> 🍌</div>
            </div>

            <div class="loan-panel">
                <h3>Rychlá Půjčka</h3>
                <p>Půjč si 5000 🍌 ihned. Na následky se neptej.</p>
                <button id="loan-btn" class="action-btn warning" style="margin-bottom: 15px;">PŮJČIT 5000 🍌</button>
                <button id="repay-btn" class="action-btn success">SPLATIT DLUH (VŠE)</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
