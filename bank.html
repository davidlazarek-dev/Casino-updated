<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opičí Banka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn" onclick="navigate('index.html')">🏠 Automaty</button>
        <button class="nav-btn active" onclick="navigate('bank.html')">🦍 Banka</button>
        <button class="nav-btn" onclick="navigate('help.html')">🆘 Pomoc</button>
        <button class="nav-btn" onclick="window.location.href='cpp.html'">🐺 Svatyně (Čtvrtletka)</button>
    </nav>

    <div class="page-layout">
        <div class="panel-container">
            <div class="header">
                <h1>OPIČÍ BANKA</h1>
                <div class="subtitle">Půjč si hned, lituj později</div>
            </div>

            <div class="status-bar">
                <div class="status-box">
                    <div class="status-label">TVÉ BANÁNY</div>
                    <div class="status-val val-good"><span id="wallet-display">0</span> 🍌</div>
                </div>
                <div class="status-box">
                    <div class="status-label">CELKOVÝ DLUH</div>
                    <div class="status-val val-bad"><span id="debt-display">0</span> 🍌</div>
                </div>
            </div>

            <div class="bank-actions">
                <div class="action-card">
                    <h3>Rychlá půjčka</h3>
                    <p>Dostaneš <strong>100 🍌</strong><br>Vrátíš <strong>120 🍌</strong></p>
                    <button class="btn-primary" onclick="takeLoan()">PŮJČIT SI (100 🍌)</button>
                </div>

                <div class="action-card">
                    <h3>Splátka dluhu</h3>
                    <p>Splť vše, co dlužíš šimpanzovi.</p>
                    <button class="btn-secondary" id="repay-btn" onclick="repayDebt()">SPLATIT CELÝ DLUH</button>
                </div>
            </div>

            <div class="message-box">
                <p id="bank-message">Šimpanz tě sleduje...</p>
            </div>
        </div>
    </div>

    <script>
        // Načtení dat z URL
        const urlParams = new URLSearchParams(window.location.search);
        let wallet = parseInt(urlParams.get('wallet')); wallet = isNaN(wallet) ? 100 : wallet;
        let debt = parseInt(urlParams.get('debt')); debt = isNaN(debt) ? 0 : debt;
        let spinsInDebt = parseInt(urlParams.get('spins')); spinsInDebt = isNaN(spinsInDebt) ? 0 : spinsInDebt;
        let loanCount = parseInt(urlParams.get('loans')); loanCount = isNaN(loanCount) ? 0 : loanCount;

        const walletDisplay = document.getElementById('wallet-display');
        const debtDisplay = document.getElementById('debt-display');
        const bankMessage = document.getElementById('bank-message');

        function updateUI() {
            walletDisplay.textContent = wallet;
            debtDisplay.textContent = debt;
            document.getElementById('repay-btn').disabled = (debt <= 0 || wallet < debt);
        }

        function navigate(page) {
            window.location.href = `${page}?wallet=${wallet}&debt=${debt}&spins=${spinsInDebt}&loans=${loanCount}`;
        }

        function takeLoan() {
            // FIXNÍ ÚROK: Půjčíš 100, přičte se 120 k dluhu
            wallet += 100;
            debt += 120;
            loanCount++;
            
            bankMessage.textContent = "Šimpanz ti hodil svazek banánů. Užij si je!";
            bankMessage.style.color = "#4ade80";
            updateUI();
        }

        function repayDebt() {
            if (wallet >= debt) {
                wallet -= debt;
                debt = 0;
                spinsInDebt = 0; // Resetujeme počítadlo "tikání" úroku v automatech
                bankMessage.textContent = "Jsi volný! Dluh je splacen.";
                bankMessage.style.color = "#4ade80";
            } else {
                bankMessage.textContent = "Nemáš dost banánů na splacení!";
                bankMessage.style.color = "#ff4b2b";
            }
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
